<svg viewBox="280 40 340 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Hue Shift</title>
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFE8F0"/>
      <stop offset="100%" stop-color="#8FCBEA"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a2b33" flood-opacity=".28"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a2b33" flood-opacity=".22"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#fff" fill-opacity=".85"/>
    </marker>
  </defs>
  <rect x="280" y="40" width="340" height="340" rx="72" fill="url(#badgeGrad)" filter="url(#badgeShadow)"/>
  <rect x="310" y="70" width="130" height="130" rx="22" fill="#1FC9C0"/>
  <rect x="460" y="70" width="130" height="130" rx="22" fill="#4C6EF5"/>
  <rect x="310" y="220" width="130" height="130" rx="22" fill="#F2B441"/>
  <rect x="460" y="220" width="130" height="130" rx="22" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-dasharray="11 9"/>
  <g transform="translate(20 -16) rotate(7 525 285)">
    <rect x="460" y="220" width="130" height="130" rx="22" fill="#F2545B" filter="url(#softShadow)"/>
  </g>
  <path d="M560 190Q605 205 560 232" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
</svg>
